<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Toggle Test - Heavenly Wisdom Academy</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/c4254e24a8.js" crossorigin="anonymous"></script>
  <style>
    .test-container {
      max-width: 400px;
      margin: 50px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .test-title {
      text-align: center;
      color: #4a1dbd;
      margin-bottom: 30px;
    }
    .test-result {
      margin-top: 20px;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      font-weight: bold;
    }
    .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
  </style>
</head>
<body>
  <div class="container">
    <div class="test-container">
      <h2 class="test-title">🔒 Password Toggle Test</h2>
      
      <form>
        <div class="input-box password-input">
          <input type="password" id="testPassword" placeholder="Enter test password" value="TestPassword123">
          <i class="fas fa-eye password-eye" id="password-eye" onclick="togglePassword()" title="Show/Hide Password"></i>
        </div>
        
        <div class="test-result info">
          <p>👁️ Click the eye icon to toggle password visibility</p>
          <p>Current state: <span id="passwordState">Hidden</span></p>
        </div>
      </form>
      
      <div style="margin-top: 30px; text-align: center;">
        <button onclick="runTest()" style="background: #4a1dbd; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">
          🧪 Run Automated Test
        </button>
      </div>
      
      <div id="testResults" style="margin-top: 20px;"></div>
    </div>
  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('testPassword');
      const eye = document.getElementById('password-eye');
      const stateSpan = document.getElementById('passwordState');
      
      if (input.type === 'password') {
        input.type = 'text';
        eye.classList.remove('fa-eye');
        eye.classList.add('fa-eye-slash');
        stateSpan.textContent = 'Visible';
        stateSpan.style.color = '#4a1dbd';
      } else {
        input.type = 'password';
        eye.classList.remove('fa-eye-slash');
        eye.classList.add('fa-eye');
        stateSpan.textContent = 'Hidden';
        stateSpan.style.color = '#666';
      }
    }

    function runTest() {
      const resultsDiv = document.getElementById('testResults');
      const input = document.getElementById('testPassword');
      const eye = document.getElementById('password-eye');
      
      let testResults = [];
      
      // Test 1: Initial state
      if (input.type === 'password' && eye.classList.contains('fa-eye')) {
        testResults.push('✅ Initial state: Password hidden with eye icon');
      } else {
        testResults.push('❌ Initial state: Incorrect setup');
      }
      
      // Test 2: Toggle to visible
      togglePassword();
      if (input.type === 'text' && eye.classList.contains('fa-eye-slash')) {
        testResults.push('✅ Toggle to visible: Password shown with eye-slash icon');
      } else {
        testResults.push('❌ Toggle to visible: Failed');
      }
      
      // Test 3: Toggle back to hidden
      togglePassword();
      if (input.type === 'password' && eye.classList.contains('fa-eye')) {
        testResults.push('✅ Toggle to hidden: Password hidden with eye icon');
      } else {
        testResults.push('❌ Toggle to hidden: Failed');
      }
      
      // Test 4: CSS classes
      if (eye.classList.contains('password-eye')) {
        testResults.push('✅ CSS styling: Proper classes applied');
      } else {
        testResults.push('❌ CSS styling: Missing classes');
      }
      
      // Display results
      resultsDiv.innerHTML = `
        <div class="test-result ${testResults.every(r => r.startsWith('✅')) ? 'success' : 'info'}">
          <h3>Test Results:</h3>
          ${testResults.map(result => `<p>${result}</p>`).join('')}
          <p><strong>Overall: ${testResults.every(r => r.startsWith('✅')) ? '✅ All tests passed!' : '⚠️ Some tests failed'}</strong></p>
        </div>
      `;
    }

    // Auto-run test on page load
    window.addEventListener('load', () => {
      setTimeout(runTest, 1000);
    });
  </script>
</body>
</html>
