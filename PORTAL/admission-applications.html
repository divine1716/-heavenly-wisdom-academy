<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admission Applications - Admin Portal</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="admin-panel.css">
</head>
<body>
  <main class="content">
    <p><a href="admin-panel.html">← Back to Admin Panel</a></p>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
      <div><h1>Admission Applications</h1><p id="adminIdentity"></p></div>
      <button class="card-btn" id="signOut">Sign out</button>
    </div>
    <div class="stat-grid" id="statistics"></div>
    <div class="admin-card">
      <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center">
        <h2>Applications</h2>
        <div><label for="statusFilter">Show: </label><select id="statusFilter"><option value="all">All statuses</option><option value="pending">Pending</option><option value="accepted">Accepted</option><option value="rejected">Rejected</option></select> <button class="card-btn" id="refresh">Refresh</button></div>
      </div>
      <div id="applications"><p>Loading applications…</p></div>
    </div>
  </main>
  <script src="admission-applications.js"></script>
</body>
</html>
