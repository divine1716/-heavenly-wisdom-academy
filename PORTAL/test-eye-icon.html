<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eye Icon Test</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 50px;
      background: #f5f5f5;
    }
    .test-container {
      max-width: 400px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    .input-box {
      position: relative;
      margin: 20px 0;
    }
    .input-box input {
      width: 100%;
      padding: 12px 45px 12px 12px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .eye-icon {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #666;
      font-size: 16px;
      z-index: 10;
      padding: 5px;
      border-radius: 3px;
      transition: all 0.3s ease;
    }
    .eye-icon:hover {
      color: #4a1dbd;
      background-color: rgba(74, 29, 189, 0.1);
    }
    .status {
      margin-top: 20px;
      padding: 10px;
      border-radius: 5px;
      text-align: center;
      font-weight: bold;
    }
    .success { background: #d4edda; color: #155724; }
    .info { background: #d1ecf1; color: #0c5460; }
  </style>
</head>
<body>
  <div class="test-container">
    <h2>👁️ Eye Icon Visibility Test</h2>
    
    <div class="input-box">
      <input type="password" id="testPassword" placeholder="Test password field" value="TestPassword123">
      <i class="fas fa-eye eye-icon" id="eyeIcon" onclick="toggleTestPassword()">👁️</i>
    </div>
    
    <div class="status info">
      <p>Can you see the eye icon? → <span id="iconStatus">Checking...</span></p>
      <p>Password is: <span id="passwordStatus">Hidden</span></p>
    </div>
    
    <button onclick="runIconTest()" style="width: 100%; padding: 12px; background: #4a1dbd; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 15px;">
      🧪 Test Eye Icon Functionality
    </button>
    
    <div id="testResults" style="margin-top: 20px;"></div>
  </div>

  <script>
    function toggleTestPassword() {
      const input = document.getElementById('testPassword');
      const eye = document.getElementById('eyeIcon');
      const status = document.getElementById('passwordStatus');
      
      if (input.type === 'password') {
        input.type = 'text';
        eye.classList.remove('fa-eye');
        eye.classList.add('fa-eye-slash');
        eye.style.color = '#4a1dbd';
        status.textContent = 'Visible';
        status.style.color = '#4a1dbd';
      } else {
        input.type = 'password';
        eye.classList.remove('fa-eye-slash');
        eye.classList.add('fa-eye');
        eye.style.color = '#666';
        status.textContent = 'Hidden';
        status.style.color = '#666';
      }
    }

    function runIconTest() {
      const eye = document.getElementById('eyeIcon');
      const results = document.getElementById('testResults');
      
      let testResults = [];
      
      // Test 1: Icon visibility
      const eyeRect = eye.getBoundingClientRect();
      if (eyeRect.width > 0 && eyeRect.height > 0) {
        testResults.push('✅ Eye icon is visible');
      } else {
        testResults.push('❌ Eye icon is not visible');
      }
      
      // Test 2: Icon positioning
      if (eyeRect.right > 0 && eyeRect.top > 0) {
        testResults.push('✅ Eye icon is positioned correctly');
      } else {
        testResults.push('❌ Eye icon positioning issue');
      }
      
      // Test 3: FontAwesome classes
      if (eye.classList.contains('fas') && eye.classList.contains('fa-eye')) {
        testResults.push('✅ FontAwesome classes are applied');
      } else {
        testResults.push('❌ FontAwesome classes missing');
      }
      
      // Test 4: Click functionality
      try {
        toggleTestPassword();
        testResults.push('✅ Click functionality works');
      } catch (error) {
        testResults.push('❌ Click functionality failed: ' + error.message);
      }
      
      results.innerHTML = `
        <div class="status ${testResults.every(r => r.startsWith('✅')) ? 'success' : 'info'}">
          <h3>Test Results:</h3>
          ${testResults.map(result => `<p>${result}</p>`).join('')}
        </div>
      `;
    }

    // Check icon status on load
    window.addEventListener('load', () => {
      const eye = document.getElementById('eyeIcon');
      const status = document.getElementById('iconStatus');
      
      setTimeout(() => {
        const eyeRect = eye.getBoundingClientRect();
        if (eyeRect.width > 0 && eyeRect.height > 0) {
          status.textContent = '✅ Yes, visible!';
          status.style.color = 'green';
        } else {
          status.textContent = '❌ No, not visible';
          status.style.color = 'red';
        }
      }, 500);
    });
  </script>
</body>
</html>
