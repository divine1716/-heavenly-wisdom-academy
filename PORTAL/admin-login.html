<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin Login - Heavenly Wisdom Academy</title><link rel="stylesheet" href="dashboard.css"></head>
<body><main class="auth-container" style="max-width:420px;margin:80px auto;padding:30px;"><h1>Admin Portal</h1><p>Sign in to review admission applications.</p><form id="adminLoginForm"><div class="form-group"><label for="username">Username</label><input id="username" required autocomplete="username"></div><div class="form-group"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="card-btn" type="submit">Sign in</button><p id="loginError" role="alert" style="color:#b42318"></p></form></main><script src="admin-login.js"></script></body></html>
